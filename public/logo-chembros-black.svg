<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Emblem: Intersecting Chemistry Flasks with Reaction Bubbles -->
  <g transform="translate(4, 2)">
    <!-- Left Flask -->
    <path d="M22 10 H18 V16 L8 34 C6.5 36.7 8.5 40 11.6 40 H26.4 C29.5 40 31.5 36.7 30 34 L22 19 V10" stroke="#0A2533" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M11 32 C15 30 19 33 25 31 L28 36 H10 L11 32 Z" fill="#087A91" fill-opacity="0.5"/>
    
    <!-- Right Flask -->
    <path d="M34 10 H38 V16 L48 34 C49.5 36.7 47.5 40 44.4 40 H29.6 C26.5 40 24.5 36.7 26 34 L34 19 V10" stroke="#0A2533" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 32 C41 30 37 33 31 31 L28 36 H46 L45 32 Z" fill="#0A2533" fill-opacity="0.3"/>
    
    <!-- Reaction Bubbles -->
    <circle cx="28" cy="16" r="2.2" fill="#087A91"/>
    <circle cx="24" cy="8" r="1.6" fill="#0A2533"/>
    <circle cx="32" cy="6" r="1.8" fill="#087A91"/>
    <circle cx="28" cy="2" r="1.4" fill="#0A2533"/>
    
    <!-- Base Plate -->
    <line x1="14" y1="44" x2="42" y2="44" stroke="#087A91" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Wordmark: CHEM BROS -->
  <text x="66" y="36" font-family="'Cinzel', 'Cinzel Decorative', 'Trajan Pro', serif" font-weight="700" font-size="22" letter-spacing="0.22em" fill="#0A2533">CHEM BROS</text>
  <text x="68" y="48" font-family="monospace" font-weight="500" font-size="7.5" letter-spacing="0.32em" fill="#5A7785">PARFUMS LABORATORY</text>
</svg>
